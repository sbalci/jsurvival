---
title: Survival Module of ClinicoPath for jamovi
name: jsurvival
version: 1.1.4
jms: '1.0'
authors:
  - Serdar Balci
maintainer: Serdar Balci <serdarbalci@serdarbalci.com>
date: '2026-11-08'
type: R
description: >-
  Time-to-event analysis for clinicopathological research in 'jamovi':
  Kaplan-Meier estimates, log-rank tests, Cox regression, competing-risk
  cumulative incidence, cut-off analysis of continuous markers, multivariable
  and LASSO Cox models, odds ratios, and preparation of dates and outcomes for
  survival analysis. Part of the ClinicoPath suite. For comments, suggestions,
  feature requests or reporting bugs, please open an issue at
  <https://github.com/sbalci/ClinicoPathJamoviModule/issues/>.
analyses:
  - title: Single Arm Survival
    name: singlearm
    ns: jsurvival
    menuGroup: Survival
    menuTitle: Single Arm Survival
    menuSubgroup: ClinicoPath Survival
    menuSubtitle: Survival for whole group, no explanatory factor
    description: >-
      Performs survival analysis for a single cohort without group comparisons.
      Kaplan-Meier estimates use event times and risk sets; in competing-risk
      mode, cumulative incidence retains competing terminal events as separate
      states. Optional person-time rates use the sum of individual observation
      periods as their denominator. This is descriptive analysis of one cohort,
      not a treatment-effect estimate.
    ribbon: analyses
    category: analyses
  - title: Survival Analysis
    name: survival
    ns: jsurvival
    menuGroup: Survival
    menuSubgroup: ClinicoPath Survival
    menuTitle: Survival Analysis
    description: >-
      Performs univariate time-to-event analysis comparing groups using
      Kaplan-Meier estimates, log-rank tests, and Cox proportional hazards
      regression. Optional outputs include restricted mean survival time and
      crude person-time incidence rates. These methods describe associations and
      do not establish causality.
    menuSubtitle: Univariate Survival Analysis, Cox, Kaplan-Meier, 1,3,5-yr
    ribbon: analyses
    category: analyses
  - title: Survival Analysis for Continuous Explanatory Variable
    name: survivalcont
    ns: jsurvival
    menuGroup: Survival
    menuSubgroup: ClinicoPath Survival
    menuTitle: Survival Analysis for Continuous Explanatory Variable
    menuSubtitle: Cut-off & Univariate Survival Analysis
    ribbon: analyses
    category: analyses
    description: >-
      Survival analysis for one continuous explanatory variable: Cox regression
      on the continuous scale, and optional data-derived cut-offs with
      Kaplan-Meier groups. A cut-off chosen from the same data overstates the
      effect and needs independent validation. These methods describe
      associations and do not establish causality.
  - title: Multivariable Survival Analysis
    name: multisurvival
    ns: jsurvival
    menuGroup: Survival
    menuSubgroup: ClinicoPath Survival
    menuTitle: Multivariable Survival Analysis
    description: >-
      Performs multivariable survival analysis using Cox proportional hazards
      regression. With competing events it fits a Fine-Gray subdistribution
      hazard model. In multivariable survival analysis, person-time follow-up is
      crucial for properly adjusting for covariates while accounting for varying
      observation periods. The Cox proportional hazards model incorporates
      person-time by modeling the hazard function, which represents the
      instantaneous event rate per unit of person-time. When stratifying
      analyses or examining multiple predictors, the model accounts for how
      these factors influence event rates relative to the person-time at risk in
      each subgroup. Each row must represent one independent patient with one
      event or censoring time. Repeated visits, recurrent events, delayed entry,
      clustering and time-dependent covariates require a different analysis
      designed for those data.
    menuSubtitle: Multivariable Cox-regression, Adjusted Survival
    ribbon: analyses
    category: analyses
  - title: Odds Ratio Table and Plot
    name: oddsratio
    ns: jsurvival
    menuGroup: Survival
    menuSubgroup: General Statistics
    menuTitle: Odds Ratio Table and Plot
    description: >-
      Logistic regression odds-ratio table, forest plot, prediction nomogram,
      and optional binary diagnostic metrics.
    menuSubtitle: Odds Ratio for Binary Outcomes
    ribbon: analyses
    category: analyses
  - title: DateTime Converter
    name: datetimeconverter
    ns: jsurvival
    category: analyses
    menuGroup: Survival
    menuSubgroup: Data Preparation
    menuTitle: DateTime Converter
    menuSubtitle: Convert datetime and extract components
    description: >-
      Convert datetime variables to standardized format and extract datetime
      components (year, month, day, hour, minute, day name, week number,
      quarter, etc.). Features automatic format detection, quality assessment,
      and preview of converted data. Perfect for preparing datetime data for
      analysis and creating time-based variables.
  - title: Outcome Organizer for Survival Analysis
    name: outcomeorganizer
    ns: jsurvival
    category: analyses
    menuGroup: Survival
    menuSubgroup: Data Preparation
    menuTitle: Outcome Organizer for Survival Analysis
    menuSubtitle: Comprehensive Outcome Preparation for Survival Analysis
    description: >-
      Advanced tool for preparing outcome variables for various types of
      survival analysis including overall survival, cause-specific, competing
      risks, progression-free survival, and multistate models.
  - title: Lasso-Cox Regression
    name: lassocox
    ns: jsurvival
    category: analyses
    menuGroup: Survival
    menuSubgroup: Penalized Cox Regression
    menuTitle: LASSO Cox
    menuSubtitle: Sparse Cox model development with cross-validated L1 penalization.
    description: >
      Fits a cross-validated LASSO-penalized Cox model for exploratory model
      development. Apparent performance requires internal and external
      validation before clinical use.
  - title: Comprehensive Time Interval Calculator
    name: timeinterval
    ns: jsurvival
    category: analyses
    menuGroup: Survival
    menuSubgroup: Data Preparation
    menuTitle: Comprehensive Time Interval Calculator
    menuSubtitle: Advanced time interval analysis with quality assessment
    description: >-
      Advanced time interval calculator designed for survival analysis,
      epidemiological studies,  and person-time analysis. Features intelligent
      date parsing, comprehensive data quality  assessment, landmark analysis,
      and robust statistical summaries. Time intervals form the  foundation of
      person-time follow-up calculations, capturing both participant counts and 
      observation duration for accurate incidence rate calculations.
datasets:
  - name: histopathology including analysis
    path: histopathologySurvival.omv
    description: >-
      Simulated histopathology cohort with a saved survival analysis, for
      demonstration only. Patient names are invented. Outcome 1 = dead, 0 =
      alive; OverallTime is in months.
    tags:
      - Survival
      - Natural Language
  - name: 'DateTime Converter: ISO dates and missing values'
    path: datetimeconverter_example.omv
    description: >-
      Eight synthetic rows with ISO dates, a missing value, alternative mixed
      text and Excel serial-date columns. Saved analysis converts iso_date using
      YMD and UTC, previews ten rows, extracts year/month/day and exports year.
      Seven values parse and one is originally missing. Alternative columns
      allow manual checks of malformed input and Excel dates. Demonstration
      only.
    tags:
      - Data preparation
      - Dates
      - Missing values
  - name: 'LASSO Cox: reproducible penalty selection'
    path: lassocox_example.omv
    description: >-
      Synthetic cohort of 150 patients with group, stage, age and marker as
      candidate predictors. Saved LASSO Cox analysis uses five-fold
      cross-validation, lambda.min, seed 123456 and internal standardization,
      with coefficient, CV and development-sample risk-group plots. time is in
      months; event 1 = event, 0 = censored. Displayed performance is apparent,
      not externally validated.
    tags:
      - Survival
      - LASSO
      - Cox regression
      - Cross-validation
  - name: 'Multivariable Survival: categorical and continuous predictors'
    path: multisurvival_example.omv
    description: >-
      Synthetic cohort of 150 patients. Saved Cox model includes group, stage,
      age and marker, with a hazard-ratio forest plot and proportional-hazards
      diagnostics. time is in months; event 1 = observed event, 0 =
      right-censored. No interaction terms are fitted in this example.
      Associations are illustrative.
    tags:
      - Survival
      - Cox regression
      - Multivariable
      - Forest plot
  - name: 'Odds Ratios: Firth fit and nomogram safeguard'
    path: oddsratio_example.omv
    description: >-
      Synthetic binary-outcome example (150 rows): event 1 = positive, 0 =
      negative; predictors are group, age and marker. Saved Firth logistic fit
      includes explanations and deliberately requests prediction/diagnostic
      output to demonstrate the Firth nomogram safeguard. No nomogram is
      produced; diagnostic metrics await explicit predictor-level coding. This
      illustrates binary associations, not censoring-aware survival risks or
      clinical accuracy.
    tags:
      - Logistic regression
      - Odds ratio
      - Firth
      - Model safeguards
  - name: 'Outcome Organizer: explicit vital-status mapping'
    path: outcomeorganizer_example.omv
    description: >-
      Synthetic cohort of 150 patients. AWOD = alive without disease, AWD =
      alive with disease, DOD = death of disease, DOOC = death of other causes.
      Saved overall-survival mapping counts both death categories as events and
      exports the recoded outcome, with diagnostics and visualization. followup
      is in months; patient_id contains invented identifiers. Competing-risk
      mapping can be explored by changing analysis type without discarding
      other-cause deaths.
    tags:
      - Data preparation
      - Outcomes
      - Overall survival
      - Competing risks
  - name: 'Single Arm Survival: Kaplan-Meier and person-time'
    path: singlearm_example.omv
    description: >-
      Synthetic cohort of 150 independent patients, with a saved single-cohort
      Kaplan-Meier analysis, confidence intervals, risk table, censor marks and
      person-time rates. time is in months; event 1 = observed event, 0 =
      right-censored (106 events, 44 censored). Demonstration only.
    tags:
      - Survival
      - Kaplan-Meier
      - Person-time
  - name: 'Survival Analysis: groups and age adjustment'
    path: survival_example.omv
    description: >-
      Synthetic cohort of 150 patients. Saved group comparison with Kaplan-Meier
      curves, confidence intervals, risk table, proportional-hazards
      diagnostics, age adjustment, adjusted curves and RMST with an automatic
      horizon. time is in months; event 1 = observed event, 0 = right-censored.
      Group labels are illustrative and do not establish treatment effects.
    tags:
      - Survival
      - Kaplan-Meier
      - Cox regression
      - RMST
  - name: 'Continuous Marker Survival: exploratory cut-off'
    path: survivalcont_example.omv
    description: >-
      Synthetic cohort of 150 patients. Saved continuous-marker Cox analysis,
      exploratory optimal cut-off, grouped Kaplan-Meier plot, confidence
      intervals, risk table and exported cut-off groups. time is in months;
      event 1 = observed event, 0 = right-censored. The data-derived cut-off
      requires independent validation and is not a clinical threshold.
    tags:
      - Survival
      - Continuous marker
      - Cut-off
      - Cox regression
  - name: 'Time Intervals: standardized months'
    path: timeinterval_example.omv
    description: >-
      Synthetic start/end ISO dates for 150 patients. Saved analysis calculates
      standardized months (elapsed days / 30.4375), exports calculated time, and
      displays quality metrics and summary. There are no missing or negative
      intervals. Calendar and standardized durations have different meanings;
      select the time basis explicitly before using the output in survival
      analysis.
    tags:
      - Data preparation
      - Dates
      - Time intervals
      - Person-time
usesNative: true
minApp: 2.7.27

...
