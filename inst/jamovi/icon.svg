  <!-- Survival Axes (Time horizontal, Survival Probability vertical) -->
  <path d="M 10 6 L 10 38 L 68 38" stroke="#3e6da9" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  
  <!-- Kaplan-Meier Curve 1: Favorable / Treatment Group (Blue) -->
  <path d="M 10 10 H 25 V 15 H 42 V 21 H 56 V 26 H 66" 
        stroke="#6b9de8" stroke-width="2.5" fill="none" stroke-linecap="square"/>
        
  <!-- Kaplan-Meier Curve 2: Control / High-Risk Group (Warm Amber) -->
  <path d="M 10 10 H 18 V 19 H 32 V 27 H 46 V 34 H 60" 
        stroke="#e6ac40" stroke-width="2.5" fill="none" stroke-linecap="square"/>
        
  <!-- Censoring tick marks (+) on Curve 1 -->
  <line x1="20" y1="8" x2="20" y2="12" stroke="#3e6da9" stroke-width="1.8"/>
  <line x1="34" y1="13" x2="34" y2="17" stroke="#3e6da9" stroke-width="1.8"/>
  <line x1="50" y1="19" x2="50" y2="23" stroke="#3e6da9" stroke-width="1.8"/>
  
  <!-- Censoring tick marks (+) on Curve 2 -->
  <line x1="26" y1="17" x2="26" y2="21" stroke="#9f9f9f" stroke-width="1.8"/>
  <line x1="40" y1="25" x2="40" y2="29" stroke="#9f9f9f" stroke-width="1.8"/>
</svg>
